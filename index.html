<!-- waits for one second before redirecting user to either the english version of the vietnamese version -->
<!-- added since v30092026 -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>heloworlweb: redirecting...</title>
    <style>
      body {
        background-color: #000000;
        color: #ffffff;
      }
      h1 {
        color: #ffffff;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1 id="bro">redirecting...</h1>
    <script>
      const text = document.getElementById("bro");
      const waithowmuch = 1000;
      async function redirect() {
        const language = navigator.language || navigator.userLanguage;
        if (language.toLowerCase().startsWith("vi")) {
          text.textContent = "đang dẫn...";
          await wait(waithowmuch);
          window.location.replace("./vi/index.html");
        } else {
          await wait(waithowmuch);
          window.location.replace("./en/index.html");
        }
      }
      function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }
      redirect();
    </script>
  </body>
</html>
