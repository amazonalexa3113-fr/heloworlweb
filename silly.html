    <h1></h1>

    <h2>silly search engine lmfaooo</h2>
    <input type="text" placeholder="URL" id="URLBox" />
    <button id="URLEnt">lessgo</button>

    <script>
      const URLBox = document.getElementById("URLBox");
      const URLEnt = document.getElementById("URLEnt");

      // Remember the last URL
      const savedURL = localStorage.getItem("sillyURL");

      if (savedURL) {
        URLBox.value = savedURL;
      }

      function getURL() {
        let url = URLBox.value.trim();

        if (!url.startsWith("http://") && !url.startsWith("https://")) {
          url = "https://" + url;
        }

        return url;
      }

      // Enter = open in the same tab
      URLBox.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          const url = getURL();

          localStorage.setItem("sillyURL", url);

          window.open(url, "_blank");
        }
      });

      // lessgo = open in a new tab
      URLEnt.addEventListener("click", () => {
        const url = getURL();

        localStorage.setItem("sillyURL", url);

        window.open(url, "_blank");
      });
    </script>
  </body>
